<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Medical AI Login</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI;
    background:linear-gradient(135deg,#4e73df,#1cc88a);
}

.card{
    background:white;
    width:380px;
    padding:40px;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#2a5298;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

input:focus{
    border-color:#4e73df;
    outline:none;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#4e73df;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#224abe;
}

#error{
    color:red;
    margin-top:12px;
}

</style>
</head>

<body>

<div class="card">
<h2>Medical AI Login</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div id="error"></div>

</div>

<script>

async function login(){

    const uname = document.getElementById("username").value.trim();
    const pwd = document.getElementById("password").value.trim();
    const errBox = document.getElementById("error");

    errBox.innerText = "";

    if(!uname || !pwd){
        errBox.innerText = "Enter username and password";
        return;
    }

    try{

        const res = await fetch("http://127.0.0.1:8000/login",{
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify({
                username: uname,
                password: pwd
            })
        });

        const data = await res.json();
        console.log("LOGIN RESPONSE:", data);

        if(data.access_token){
            localStorage.setItem("token", data.access_token);
            localStorage.setItem("username", data.username);

            window.location.href = "index.html";
        }
        else{
            errBox.innerText = data.error || "Invalid credentials";
        }

    }catch(e){
        console.error(e);
        errBox.innerText = "Server not reachable";
    }
}

</script>


</body>
</html>
